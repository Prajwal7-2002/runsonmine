[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[project]
name = "runsonmine"
version = "0.3.0"
description = "Measured local LLM speeds on real machines: validate results and build the RunsOnMine site."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Prajwal Pujari" }]
keywords = ["llm", "benchmark", "local-llm", "ollama", "llama.cpp", "gpu", "inference"]
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
runsonmine = "runsonmine.cli:main"

[project.urls]
Repository = "https://github.com/Prajwal7-2002/runsonmine"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.110", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
